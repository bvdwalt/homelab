---
- name: Install curl
  apt:
    name: curl
    state: present
    update_cache: true

- name: Check whether k3s is already installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Install k3s
  shell: curl -sfL https://get.k3s.io | sh -
  args:
    creates: /usr/local/bin/k3s
  when: not k3s_binary.stat.exists

- name: Ensure /etc/rancher/k3s exists
  file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Write k3s config.yaml
  template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0644"
  notify: restart k3s

- name: Write custom resolv.conf (avoids greedo.net search-domain poisoning)
  template:
    src: resolv.conf.j2
    dest: /etc/rancher/k3s/resolv.conf
    mode: "0644"
  notify: restart k3s

- name: Ensure k3s systemd override directory exists
  file:
    path: /etc/systemd/system/k3s.service.d
    state: directory
    mode: "0755"

- name: Write /proc/sys remount override (Proxmox mounts it read-only in LXC)
  template:
    src: proc-sys.conf.j2
    dest: /etc/systemd/system/k3s.service.d/proc-sys.conf
    mode: "0644"
  notify:
    - reload systemd
    - restart k3s

- name: Flush handlers before verifying node readiness
  meta: flush_handlers

- name: Ensure k3s is running
  service:
    name: k3s
    state: started
    enabled: true

- name: Wait for the node to report Ready
  command: /usr/local/bin/k3s kubectl get node {{ inventory_hostname }} -o jsonpath={.status.conditions[?(@.type=="Ready")].status}
  register: node_ready
  until: node_ready.stdout == "True"
  retries: 30
  delay: 10
  changed_when: false
  when: not ansible_check_mode
