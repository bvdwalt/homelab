---
- name: Configure Altair k3s node (LXC)
  hosts: k3s_altair
  become: false # already connecting as root
  roles:
    - k3s_lxc

- name: Post-install cluster fixups (run from control machine, not the LXC)
  hosts: k3s_altair
  connection: local
  gather_facts: false
  roles:
    - k3s_cluster_init
