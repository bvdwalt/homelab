apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellystat
  namespace: flux-system
spec:
  releaseName: jellystat
  targetNamespace: jellystat
  values:
    image: cyfershepard/jellystat:1.1.12@sha256:e61c759ec706da378bc8374e797da1dfd298ab30f804cefd82d192c301a888c7
    port: 3000
    hostname: jellystat.greedo.net
    middlewares:
      - name: household-oidc-auth
        namespace: kube-system
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 512Mi
    readinessProbe:
      httpGet:
        path: /auth/isConfigured
        port: 3000
      initialDelaySeconds: 15
      periodSeconds: 10
      failureThreshold: 6
    livenessProbe:
      httpGet:
        path: /auth/isConfigured
        port: 3000
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 3
    env:
      POSTGRES_IP: "postgresql.postgresql.svc.cluster.local"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "jellystat"
      POSTGRES_DB: "jellystat"
      TZ: "Africa/Johannesburg"
    persistence:
      enabled: true
      mountPath: /app/backend/backup-data
      size: 1Gi
      storageClass: nfs-shared
      accessMode: ReadWriteMany
    existingSecret: jellystat-secrets
    securityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      readOnlyRootFilesystem: true
