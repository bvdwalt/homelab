apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pvc.yaml
  - deployment.yaml
  - services.yaml
  - ingressroute.yaml
  - networkpolicy.yaml
# PVC data survives a removed manifest; delete it explicitly.
patches:
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: placeholder
        labels:
          kustomize.toolkit.fluxcd.io/prune: disabled
