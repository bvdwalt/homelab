apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: palimpsest
  namespace: flux-system
spec:
  releaseName: palimpsest
  targetNamespace: palimpsest
  values:
    image: ghcr.io/bvdwalt/palimpsest:0.8.0@sha256:ae84b17389e47481dc35b721d38b84c6677e3cfdf41b4d0578441eefca0dd721
    port: 8080
    hostname: notes.greedo.net
    strategy: Recreate
    middlewares:
      - name: infra-admin-oidc-auth
        namespace: kube-system
    bypassOidcPathPrefix: /api
    bypassOidcExceptPath: /api/config
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 128Mi
    livenessProbe:
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 15
      periodSeconds: 30
      failureThreshold: 3
    env:
      PYROSCOPE_SERVER_ADDRESS: "http://pyroscope.monitoring.svc.cluster.local:4040"
    persistence:
      enabled: true
      size: 500Mi
      mountPath: /data
    securityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
