apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: flux-system
spec:
  releaseName: jellyfin
  targetNamespace: jellyfin
  values:
    image: jellyfin/jellyfin:12.2@sha256:357724bf0ae27a672c7cbaa899db2d9abeb13dbd8657ccce750258a4c059d037
    port: 8096
    hostname: jellyfin.greedo.net
    strategy: Recreate
    resources:
      requests:
        memory: 512Mi
      limits:
        memory: 4Gi
        gpu.intel.com/i915: 1
    readinessProbe:
      httpGet:
        path: /health
        port: 8096
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 6
    livenessProbe:
      httpGet:
        path: /
        port: 8096
      initialDelaySeconds: 60
      periodSeconds: 30
      failureThreshold: 3
    env:
      TZ: Africa/Johannesburg
      JELLYFIN_CONFIG_DIR: /config
      JELLYFIN_DATA_DIR: /config/data
      JELLYFIN_CACHE_DIR: /config/cache
      JELLYFIN_LOG_DIR: /config/log
    persistence:
      enabled: true
      mountPath: /config
      size: 10Gi
    emptyDirs:
      - name: tmp
        mountPath: /tmp
    hostPaths:
      - name: shows
        hostPath: /mnt/media/shows
        mountPath: /shows
      - name: movies
        hostPath: /mnt/media/movies
        mountPath: /movies
      - name: music
        hostPath: /mnt/media/music
        mountPath: /music
      - name: tube
        hostPath: /mnt/media/tube
        mountPath: /tube
    middlewares: []
    securityContext:
      enabled: true
      privileged: false
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 993
      readOnlyRootFilesystem: true
      supplementalGroups:
        - 0
    # seerr and glance call in directly; see commit message for egress rationale.
    networkPolicy:
      enabled: true
      ingress:
        - fromEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: seerr
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: glance
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: cullarr
          toPorts:
            - ports:
                - port: "8096"
                  protocol: TCP
      egress:
        - toFQDNs:
            - matchName: api.themoviedb.org
            - matchName: image.tmdb.org
            - matchName: api.trakt.tv
            - matchPattern: "*.jellyfin.org"
            - matchName: www.omdbapi.com
            - matchName: musicbrainz.org
            - matchName: www.theaudiodb.com
            - matchPattern: "*.github.io"
            - matchName: raw.githubusercontent.com
          toPorts:
            - ports:
                - port: "443"
                  protocol: TCP
