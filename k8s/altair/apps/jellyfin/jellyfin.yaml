apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: flux-system
spec:
  releaseName: jellyfin
  targetNamespace: jellyfin
  values:
    image: jellyfin/jellyfin:12.0@sha256:baba630419915985442f315f08b0cf46d9f4c8a0cc4bd38e94a6d35751dd5ef5
    port: 8096
    hostname: jellyfin.greedo.net
    strategy: Recreate
    resources:
      requests:
        memory: 512Mi
      limits:
        memory: 4Gi
        gpu.intel.com/i915: 1
    readinessProbe:
      httpGet:
        path: /health
        port: 8096
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 6
    livenessProbe:
      httpGet:
        path: /
        port: 8096
      initialDelaySeconds: 60
      periodSeconds: 30
      failureThreshold: 3
    env:
      TZ: Africa/Johannesburg
      JELLYFIN_CONFIG_DIR: /config
      JELLYFIN_DATA_DIR: /config/data
      JELLYFIN_CACHE_DIR: /config/cache
      JELLYFIN_LOG_DIR: /config/log
    persistence:
      enabled: true
      mountPath: /config
      size: 10Gi
    emptyDirs:
      - name: tmp
        mountPath: /tmp
    hostPaths:
      - name: shows
        hostPath: /mnt/media/shows
        mountPath: /shows
      - name: movies
        hostPath: /mnt/media/movies
        mountPath: /movies
      - name: music
        hostPath: /mnt/media/music
        mountPath: /music
      - name: tube
        hostPath: /mnt/media/tube
        mountPath: /tube
    middlewares: []
    securityContext:
      enabled: true
      privileged: false
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 993
      readOnlyRootFilesystem: true
      supplementalGroups:
        - 0
