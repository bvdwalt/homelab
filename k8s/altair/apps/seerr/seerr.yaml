apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
  namespace: flux-system
spec:
  releaseName: seerr
  targetNamespace: seerr
  values:
    image: ghcr.io/seerr-team/seerr:v3.5.0@sha256:c33702abebcec295b69a1371417b3a350e31dfeacbae3158e790c86908dc3659
    port: 5055
    hostname: seerr.greedo.net
    middlewares:
      - name: household-oidc-auth
        namespace: kube-system
    strategy: Recreate
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 384Mi
    livenessProbe:
      httpGet:
        path: /
        port: 5055
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 3
    env:
      TZ: Africa/Johannesburg
    persistence:
      enabled: true
      mountPath: /app/config
      size: 1Gi
    securityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      readOnlyRootFilesystem: true
    # glance calls in directly; see commit message for egress rationale.
    networkPolicy:
      enabled: true
      ingress:
        - fromEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: glance
          toPorts:
            - ports:
                - port: "5055"
                  protocol: TCP
      egress:
        - toEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: jellyfin
          toPorts:
            - ports:
                - port: "8096"
                  protocol: TCP
        - toEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: downloads
          toPorts:
            - ports:
                - port: "7878"
                  protocol: TCP
                - port: "8989"
                  protocol: TCP
        - toFQDNs:
            - matchName: api.themoviedb.org
            - matchName: image.tmdb.org
          toPorts:
            - ports:
                - port: "443"
                  protocol: TCP
