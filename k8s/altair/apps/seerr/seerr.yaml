apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
  namespace: flux-system
spec:
  releaseName: seerr
  targetNamespace: seerr
  values:
    image: ghcr.io/seerr-team/seerr:v3.5.0@sha256:c33702abebcec295b69a1371417b3a350e31dfeacbae3158e790c86908dc3659
    port: 5055
    hostname: seerr.greedo.net
    middlewares:
      - name: household-oidc-auth
        namespace: kube-system
    strategy: Recreate
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 384Mi
    livenessProbe:
      httpGet:
        path: /
        port: 5055
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 3
    env:
      TZ: Africa/Johannesburg
    persistence:
      enabled: true
      mountPath: /app/config
      size: 1Gi
    securityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      readOnlyRootFilesystem: true
