apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
  namespace: flux-system
spec:
  releaseName: seerr
  targetNamespace: seerr
  values:
    image: ghcr.io/seerr-team/seerr:v3.4.1@sha256:b21cf91bb7a10d70446e104e7b7b9c9c386aa22beeac535a3271cbfc5843d142
    port: 5055
    hostname: seerr.greedo.net
    middlewares:
      - name: household-oidc-auth
        namespace: kube-system
    strategy: Recreate
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 384Mi
    livenessProbe:
      httpGet:
        path: /
        port: 5055
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 3
    env:
      TZ: Europe/Amsterdam
    persistence:
      enabled: true
      mountPath: /app/config
      size: 1Gi
    securityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
