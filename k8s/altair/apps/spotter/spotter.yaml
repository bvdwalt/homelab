apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spotter
  namespace: flux-system
spec:
  releaseName: spotter
  targetNamespace: spotter
  values:
    image: ghcr.io/bvdwalt/spotter:0.9.0@sha256:700d34391c71ad0530ced0714758752a075d2b1909e79b8eee5c1539f204f712
    port: 8080
    hostname: spotter.greedo.net
    strategy: Recreate # one AISStream connection per API key, and a single SQLite writer
    middlewares:
      - name: household-oidc-auth
        namespace: kube-system
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 128Mi
    livenessProbe:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 15
      periodSeconds: 30
      failureThreshold: 3
    env:
      TZ: Africa/Johannesburg
      RADIUS_NM: "150"
      ADSB_BASE_URL: https://opendata.adsb.fi/api/v2
      ADSB_POLL_INTERVAL: 5s
      ADSB_POINTS: "-32.6,19.4,250;-32.0,24.1,250;-28.0,32.3,250;-23.2,25.9,250;-26.2,17.5,250" # SA plus Namibia, Botswana, southern Mozambique
      DB_PATH: /data/spotter.db
      ROUTE_API_URL: https://adsb.im/api/0/routeset
      PHOTO_API_URL: https://api.planespotters.net/pub/photos/hex
    existingSecret: spotter # HOME_LAT, HOME_LON, AISSTREAM_API_KEY
    persistence:
      enabled: true
      size: 1Gi
      mountPath: /data
    securityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      readOnlyRootFilesystem: true
    networkPolicy:
      enabled: true
      ingress:
        - fromEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: glance
          toPorts:
            - ports:
                - port: "8080"
                  protocol: TCP
      egress:
        - toFQDNs:
            - matchName: opendata.adsb.fi
            - matchName: stream.aisstream.io
            - matchName: adsb.im
            - matchName: api.planespotters.net
          toPorts:
            - ports:
                - port: "443"
                  protocol: TCP
