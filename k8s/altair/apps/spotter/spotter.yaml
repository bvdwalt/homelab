apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spotter
  namespace: flux-system
spec:
  releaseName: spotter
  targetNamespace: spotter
  values:
    image: ghcr.io/bvdwalt/spotter:0.13.0@sha256:aa1c1a1aea6c22a5a9cbd3a55fe60aafa25f4f422ff127fbcbd93ce81544ac8f
    port: 8080
    hostname: spotter.greedo.net
    strategy: Recreate # one AISStream connection per API key, and a single SQLite writer
    middlewares:
      - name: household-oidc-auth
        namespace: kube-system
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 128Mi
    livenessProbe:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 15
      periodSeconds: 30
      failureThreshold: 3
    env:
      TZ: Africa/Johannesburg
      RADIUS_NM: "150"
      ADSB_BASE_URL: https://opendata.adsb.fi/api/v2
      ADSB_POLL_INTERVAL: 5s
      ADSB_POINTS: "-32.8,21.3,250;-31.1,29.9,250;-24.5,30.2,250;-26.8,23.7,250;-26.5,16.3,250" # all of South Africa, Lesotho and Eswatini
      AIS_BBOX: "-45,5,-10,50" # southern Africa and the seas around it
      DB_PATH: /data/spotter.db
      ROUTE_API_URL: https://adsb.im/api/0/routeset
      PHOTO_API_URL: https://api.planespotters.net/pub/photos/hex
    existingSecret: spotter # HOME_LAT, HOME_LON, AISSTREAM_API_KEY
    persistence:
      enabled: true
      size: 1Gi
      mountPath: /data
    securityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      readOnlyRootFilesystem: true
    networkPolicy:
      enabled: true
      ingress:
        - fromEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: glance
          toPorts:
            - ports:
                - port: "8080"
                  protocol: TCP
      egress:
        - toFQDNs:
            - matchName: opendata.adsb.fi
            - matchName: stream.aisstream.io
            - matchName: adsb.im
            - matchName: api.planespotters.net
          toPorts:
            - ports:
                - port: "443"
                  protocol: TCP
