apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: navidrome
  namespace: flux-system
spec:
  releaseName: navidrome
  targetNamespace: navidrome
  values:
    image: deluan/navidrome:0.64.1@sha256:8fd1493497384585e8cdf80a61d14281129088a8bd3523be83686b6e527cbc61
    port: 4533
    hostname: navidrome.greedo.net
    strategy: Recreate
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 512Mi
    livenessProbe:
      httpGet:
        path: /
        port: 4533
      initialDelaySeconds: 15
      periodSeconds: 30
      failureThreshold: 3
    middlewares: []
    env:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      TZ: Africa/Johannesburg
    persistence:
      enabled: true
      mountPath: /data
      size: 1Gi
    securityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      readOnlyRootFilesystem: true
    initContainers:
      - name: fix-data-perms
        image: python:3.14-alpine@sha256:4677924bcc0e94505a3270e87cb1601c2af54cd92d021b8dc306618a14333bbe
        command: [chown, -R, "1000:1000", /data]
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
            add: [CHOWN]
        volumeMounts:
          - name: data
            mountPath: /data
    hostPaths:
      - name: music
        hostPath: /mnt/media/music
        mountPath: /music
    emptyDirs:
      - name: tmp
        mountPath: /tmp
