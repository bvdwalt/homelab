apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: navidrome
  namespace: flux-system
spec:
  releaseName: navidrome
  targetNamespace: navidrome
  values:
    image: deluan/navidrome:0.63.2@sha256:38246ebb80d6f7e2724eecab4acafa7b14ec66ae800b2454aa6da4c19f80a9ce
    port: 4533
    hostname: navidrome.greedo.net
    strategy: Recreate
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 512Mi
    livenessProbe:
      httpGet:
        path: /
        port: 4533
      initialDelaySeconds: 15
      periodSeconds: 30
      failureThreshold: 3
    middlewares: []
    env:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      TZ: Africa/Johannesburg
    persistence:
      enabled: true
      mountPath: /data
      size: 1Gi
    securityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      readOnlyRootFilesystem: true
    initContainers:
      - name: fix-data-perms
        image: python:3.14-alpine@sha256:5e0ede45886712ce95b0e66232f743cc3d69ff6c2f62cc0d63778e1e894f8bd4
        command: [chown, -R, "1000:1000", /data]
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
            add: [CHOWN]
        volumeMounts:
          - name: data
            mountPath: /data
    hostPaths:
      - name: music
        hostPath: /mnt/media/music
        mountPath: /music
    emptyDirs:
      - name: tmp
        mountPath: /tmp
