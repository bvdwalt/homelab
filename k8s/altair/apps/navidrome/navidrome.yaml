apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: navidrome
  namespace: flux-system
spec:
  releaseName: navidrome
  targetNamespace: navidrome
  values:
    image: deluan/navidrome:0.64.2@sha256:59ce76e6e06193fbfbb1736a93b8468227e1ea663fc7b25b1da13fbb97f5197b
    port: 4533
    hostname: navidrome.greedo.net
    strategy: Recreate
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 512Mi
    livenessProbe:
      httpGet:
        path: /
        port: 4533
      initialDelaySeconds: 15
      periodSeconds: 30
      failureThreshold: 3
    middlewares: []
    env:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      TZ: Africa/Johannesburg
    persistence:
      enabled: true
      mountPath: /data
      size: 1Gi
    securityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      readOnlyRootFilesystem: true
    initContainers:
      - name: fix-data-perms
        image: python:3.14-alpine@sha256:7f2ec713f0436c59df2362d973b6a05af9e87ba78f0e94f5245c302984a7a1fd
        command: [chown, -R, "1000:1000", /data]
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
            add: [CHOWN]
        volumeMounts:
          - name: data
            mountPath: /data
    hostPaths:
      - name: music
        hostPath: /mnt/media/music
        mountPath: /music
    emptyDirs:
      - name: tmp
        mountPath: /tmp
    # glance calls in directly. insights.navidrome.org telemetry is
    # intentionally not allowed (no egress block = blocked once enforced).
    networkPolicy:
      enabled: true
      ingress:
        - fromEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: glance
          toPorts:
            - ports:
                - port: "4533"
                  protocol: TCP
