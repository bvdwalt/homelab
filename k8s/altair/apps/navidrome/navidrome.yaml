apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: navidrome
  namespace: flux-system
spec:
  releaseName: navidrome
  targetNamespace: navidrome
  values:
    image: deluan/navidrome:0.64.2@sha256:59ce76e6e06193fbfbb1736a93b8468227e1ea663fc7b25b1da13fbb97f5197b
    port: 4533
    hostname: navidrome.greedo.net
    strategy: Recreate
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 512Mi
    livenessProbe:
      httpGet:
        path: /
        port: 4533
      initialDelaySeconds: 15
      periodSeconds: 30
      failureThreshold: 3
    middlewares: []
    env:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      TZ: Africa/Johannesburg
      ND_ENABLEINSIGHTSCOLLECTOR: "false"
      ND_UILOGINBACKGROUNDURL: ""
      # default priority plus nd-lyrics as last fallback
      ND_LYRICSPRIORITY: ".ttml,.yaml,.yml,.elrc,.lrc,.srt,.txt,embedded,nd-lyrics"
    persistence:
      enabled: true
      mountPath: /data
      size: 1Gi
    securityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      readOnlyRootFilesystem: true
    initContainers:
      - name: fix-data-perms
        image: python:3.15-alpine@sha256:c480059ce7dd8fc98f30e2a56cc3b54e559c3b3b66cc498a92f641237a47f288
        command: [chown, -R, "1000:1000", /data]
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
            add: [CHOWN]
        volumeMounts:
          - name: data
            mountPath: /data
      # nd-lyrics plugin; file name (minus .ndp) is the ND_LYRICSPRIORITY key
      - name: fetch-lyrics-plugin
        image: python:3.15-alpine@sha256:c480059ce7dd8fc98f30e2a56cc3b54e559c3b3b66cc498a92f641237a47f288
        env:
          # renovate: datasource=github-release-attachments depName=J0R6IT0/navidrome-lyrics-plugin
          - name: PLUGIN_VERSION
            value: v8.1.0
          - name: PLUGIN_SHA256
            value: 29dd571ba0d4bb756e62c0d5c594a2d7e7c9ccec2950f3b027bd64c73c605715
        command:
          - python
          - -c
          - |
            import hashlib, os, sys, urllib.request
            dest = "/data/plugins/nd-lyrics.ndp"
            want = os.environ["PLUGIN_SHA256"]
            sha = lambda b: hashlib.sha256(b).hexdigest()
            if os.path.exists(dest) and sha(open(dest, "rb").read()) == want:
                sys.exit(0)
            url = ("https://github.com/J0R6IT0/navidrome-lyrics-plugin/releases/download/"
                   + os.environ["PLUGIN_VERSION"] + "/nd-lyrics.ndp")
            data = urllib.request.urlopen(url, timeout=60).read()
            if sha(data) != want:
                sys.exit(f"sha256 mismatch for {url}: got {sha(data)}")
            os.makedirs("/data/plugins", mode=0o700, exist_ok=True)
            open(dest + ".tmp", "wb").write(data)
            os.replace(dest + ".tmp", dest)
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: data
            mountPath: /data
    hostPaths:
      - name: music
        hostPath: /mnt/media/music
        mountPath: /music
    emptyDirs:
      - name: tmp
        mountPath: /tmp
    # glance calls in directly. insights.navidrome.org telemetry is
    # intentionally not allowed (no egress block = blocked once enforced).
    networkPolicy:
      enabled: true
      ingress:
        - fromEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: glance
          toPorts:
            - ports:
                - port: "4533"
                  protocol: TCP
      egress:
        # deezer album art
        - toFQDNs:
            - matchName: api.deezer.com
            - matchPattern: "*.dzcdn.net"
          toPorts:
            - ports:
                - port: "443"
                  protocol: TCP
        # lyrics plugin download and its default providers
        - toFQDNs:
            - matchName: github.com
            - matchName: release-assets.githubusercontent.com
            - matchName: lrclib.net
            - matchName: api.lyrics.ovh
          toPorts:
            - ports:
                - port: "443"
                  protocol: TCP
