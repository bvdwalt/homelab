apiVersion: apps/v1
kind: Deployment
metadata:
  name: tdarr
  namespace: tdarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tdarr
  template:
    metadata:
      labels:
        app: tdarr
    spec:
      containers:
        - name: tdarr
          image: ghcr.io/haveagitgat/tdarr:2.86.01@sha256:45742f00e51a58553844c8b13d97e7ae9b2ee9a056bd8e5993d9a8282a45a23f
          securityContext:
            privileged: true
            runAsUser: 0
          env:
            - name: TZ
              value: Europe/Amsterdam
            - name: PUID
              value: "0"
            - name: PGID
              value: "0"
            - name: UMASK_SET
              value: "002"
            - name: serverIP
              value: "0.0.0.0"
            - name: serverPort
              value: "8266"
            - name: webUIPort
              value: "8265"
            - name: internalNode
              value: "true"
            - name: nodeName
              value: AltairInternalNode
          ports:
            - containerPort: 8265
            - containerPort: 8266
          volumeMounts:
            - name: server
              mountPath: /app/server
            - name: configs
              mountPath: /app/configs
            - name: logs
              mountPath: /app/logs
            - name: cache
              mountPath: /temp
            - name: shows
              mountPath: /shows
            - name: movies
              mountPath: /movies
          readinessProbe:
            httpGet:
              path: /
              port: 8265
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 8265
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 4Gi
      volumes:
        - name: server
          persistentVolumeClaim:
            claimName: tdarr-server
        - name: configs
          persistentVolumeClaim:
            claimName: tdarr-configs
        - name: logs
          persistentVolumeClaim:
            claimName: tdarr-logs
        - name: cache
          hostPath:
            path: /mnt/downloads/tdarr-cache
            type: DirectoryOrCreate
        - name: shows
          hostPath:
            path: /mnt/media/shows
        - name: movies
          hostPath:
            path: /mnt/media/movies
