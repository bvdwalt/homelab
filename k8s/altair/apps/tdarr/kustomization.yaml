apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pvcs.yaml
  - deployment.yaml
  - service.yaml
  - ingressroute.yaml
  - networkpolicy.yaml
  - flow-sync.yaml
# PVC data survives a removed manifest; delete it explicitly.
patches:
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: placeholder
        labels:
          kustomize.toolkit.fluxcd.io/prune: disabled
configMapGenerator:
  - name: tdarr-flow
    namespace: tdarr
    files:
      - flow/flow.json
      - flow/sync.js
