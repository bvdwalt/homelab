apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka
  namespace: kafka
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # In-namespace: broker <-> entity operator, cluster operator, kafka-ui
    - from:
        - podSelector: {}
      ports:
        - port: 9092
    # Traefik (kube-system) -> kafka-ui
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 80
