apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: order-pipeline
  namespace: kafka
spec:
  kafka:
    version: 4.3.1
    metadataVersion: 4.3-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:
    topicOperator:
      resources:
        requests:
          cpu: 10m
          memory: 256Mi
        limits:
          memory: 384Mi
    userOperator:
      resources:
        requests:
          cpu: 10m
          memory: 256Mi
        limits:
          memory: 384Mi
