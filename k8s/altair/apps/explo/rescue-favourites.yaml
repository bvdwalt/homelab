apiVersion: batch/v1
kind: CronJob
metadata:
  name: rescue-favourites
  namespace: explo
spec:
  # 2h before Explo's Tuesday 00:15 run
  schedule: "0 22 * * 1"
  timeZone: Africa/Johannesburg
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: rescue-favourites
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rescue-favourites
              image: ghcr.io/bvdwalt/homelab-rescue-favourites:sha-34a8b02a5e4ccfae94f2f97f002fb97a8d63a8bf@sha256:d65b6c22487f655306d0439325494d5b6b02be02593306784be10658be1ac2ba
              env:
                - name: NAVIDROME_URL
                  value: http://navidrome.navidrome.svc.cluster.local
                - name: MUSIC_ROOT
                  value: /music
                - name: EXPLO_SUBDIR
                  value: explo/barend
                # "true" only logs the planned moves
                - name: DRY_RUN
                  value: "false"
              envFrom:
                - secretRef:
                    name: explo-barend
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: music
                  mountPath: /music
          volumes:
            - name: music
              hostPath:
                path: /mnt/media/music
                type: Directory
