apiVersion: batch/v1
kind: CronJob
metadata:
  name: rescue-favourites
  namespace: explo
spec:
  # 2h before Explo's Tuesday 00:15 run
  schedule: "0 22 * * 1"
  timeZone: Africa/Johannesburg
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: rescue-favourites
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rescue-favourites
              image: python:3.15-alpine@sha256:a943ed02f4e22d024d2b4fc5083619497dfb9bc1c64c193861f3bc6d3074f5b1
              command: [python, -I, /scripts/rescue_favourites.py]
              env:
                - name: NAVIDROME_URL
                  value: http://navidrome.navidrome.svc.cluster.local
                - name: MUSIC_ROOT
                  value: /music
                - name: EXPLO_SUBDIR
                  value: explo/barend
                # flip to "false" once the logged plan looks right
                - name: DRY_RUN
                  value: "true"
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
              envFrom:
                - secretRef:
                    name: explo-barend
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: music
                  mountPath: /music
          volumes:
            - name: script
              configMap:
                name: rescue-favourites-script
            - name: music
              hostPath:
                path: /mnt/media/music
                type: Directory
