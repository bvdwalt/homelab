apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: overdrive
  namespace: flux-system
spec:
  releaseName: overdrive
  targetNamespace: overdrive
  values:
    image: robotwizard/overdrive:0.4.0@sha256:ace75b6bffdd3b7133a910601a08144627fefacf2cf6de2809d9a7e3e1440911
    port: 8080
    hostname: overdrive.greedo.net
    middlewares:
      - name: household-oidc-auth
        namespace: kube-system
    strategy: Recreate
    resources:
      requests:
        memory: 8Mi
      limits:
        memory: 64Mi
    livenessProbe:
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 15
      periodSeconds: 30
      failureThreshold: 3
    env:
      TZ: "Africa/Johannesburg"
      PYROSCOPE_SERVER_ADDRESS: "http://pyroscope.monitoring.svc.cluster.local:4040"
    securityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      readOnlyRootFilesystem: true
    persistence:
      enabled: true
      size: 500Mi
      mountPath: /data
