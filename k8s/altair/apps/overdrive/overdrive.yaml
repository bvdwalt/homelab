apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: overdrive
  namespace: flux-system
spec:
  releaseName: overdrive
  targetNamespace: overdrive
  values:
    image: robotwizard/overdrive:0.3.0@sha256:6e82c3d73171033ed456687b85a9cd992b4990ddbf94462fb1bb5d3baa556f47
    port: 8080
    hostname: overdrive.greedo.net
    middlewares:
      - name: household-oidc-auth
        namespace: kube-system
    strategy: Recreate
    resources:
      requests:
        memory: 8Mi
      limits:
        memory: 64Mi
    livenessProbe:
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 15
      periodSeconds: 30
      failureThreshold: 3
    env:
      TZ: "Europe/Amsterdam"
      PYROSCOPE_SERVER_ADDRESS: "http://pyroscope.monitoring.svc.cluster.local:4040"
    securityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
    persistence:
      enabled: true
      size: 500Mi
      mountPath: /data
