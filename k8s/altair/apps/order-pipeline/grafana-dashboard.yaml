apiVersion: v1
kind: ConfigMap
metadata:
  name: order-pipeline-dashboard
  namespace: order-pipeline
  labels:
    grafana_dashboard: "1"
data:
  order-pipeline.json: |
    {
      "title": "Order Pipeline",
      "uid": "order-pipeline",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 2,
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "order-service request rate",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (status) (rate(http_requests_total{route=\"/orders\"}[5m]))",
              "legendFormat": "status {{status}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "order-service latency",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "expr": "histogram_quantile(0.5, sum by (le) (rate(http_request_duration_seconds_bucket{route=\"/orders\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{route=\"/orders\"}[5m])))",
              "legendFormat": "p95"
            },
            {
              "expr": "sum(rate(http_request_duration_seconds_sum{route=\"/orders\"}[5m])) / sum(rate(http_request_duration_seconds_count{route=\"/orders\"}[5m]))",
              "legendFormat": "avg"
            }
          ]
        },
        {
          "id": 3,
          "title": "Consumer message throughput",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (topic, result) (rate(kafka_consumer_messages_total[5m]))",
              "legendFormat": "{{topic}} - {{result}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Consumer processing duration",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "expr": "histogram_quantile(0.5, sum by (le, topic) (rate(kafka_consumer_processing_duration_seconds_bucket[5m])))",
              "legendFormat": "{{topic}} p50"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le, topic) (rate(kafka_consumer_processing_duration_seconds_bucket[5m])))",
              "legendFormat": "{{topic}} p95"
            },
            {
              "expr": "sum by (topic) (rate(kafka_consumer_processing_duration_seconds_sum[5m])) / sum by (topic) (rate(kafka_consumer_processing_duration_seconds_count[5m]))",
              "legendFormat": "{{topic}} avg"
            }
          ]
        },
        {
          "id": 5,
          "title": "Dead-lettered messages (1h)",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (topic) (increase(kafka_consumer_messages_total{result=\"dead_lettered\"}[1h])) or vector(0)",
              "legendFormat": "{{topic}}"
            }
          ]
        },
        {
          "id": 6,
          "title": "Producer throughput",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (topic) (rate(kafka_producer_messages_total[5m])) or vector(0)",
              "legendFormat": "{{topic}} - success"
            },
            {
              "expr": "sum by (topic) (rate(kafka_producer_errors_total[5m])) or vector(0)",
              "legendFormat": "{{topic}} - error"
            }
          ]
        },
        {
          "id": 7,
          "title": "Pods up",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(up{namespace=\"order-pipeline\"})",
              "legendFormat": "up"
            }
          ]
        },
        {
          "id": 8,
          "title": "Consumer lag",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 24 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "expr": "kafka_consumer_lag",
              "legendFormat": "{{topic}}"
            }
          ]
        },
        {
          "id": 9,
          "title": "Consumer retry rate",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 24 },
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (topic) (rate(kafka_consumer_retries_total[5m])) or vector(0)",
              "legendFormat": "{{topic}}"
            }
          ]
        },
        {
          "id": 10,
          "title": "Orders processed by outcome",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 24 },
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (outcome) (rate(orders_processed_total[5m])) or vector(0)",
              "legendFormat": "{{outcome}}"
            }
          ]
        },
        {
          "id": 11,
          "title": "DLQ backlog (current)",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 32 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": { "graphMode": "area" },
          "targets": [
            {
              "expr": "dlq_pending_total",
              "legendFormat": "{{topic}}"
            }
          ]
        },
        {
          "id": 12,
          "title": "Oldest pending DLQ age",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 32 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "expr": "dlq_oldest_pending_age_seconds",
              "legendFormat": "{{topic}}"
            }
          ]
        },
        {
          "id": 13,
          "title": "Chaos-injected failures",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 32 },
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (topic) (rate(chaos_injected_total[5m])) or vector(0)",
              "legendFormat": "{{topic}}"
            }
          ]
        },
        {
          "id": 14,
          "title": "Order funnel (per stage)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 40 },
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(rate(orders_processed_total{outcome=\"accepted\"}[5m])) or vector(0)",
              "legendFormat": "orders - accepted"
            },
            {
              "expr": "sum(rate(orders_processed_total{outcome=\"rejected\"}[5m])) or vector(0)",
              "legendFormat": "orders - rejected"
            },
            {
              "expr": "sum(rate(shipments_processed_total{outcome=\"scheduled\"}[5m])) or vector(0)",
              "legendFormat": "shipments - scheduled"
            },
            {
              "expr": "sum(rate(notifications_sent_total{type=\"shipping.scheduled\"}[5m])) or vector(0)",
              "legendFormat": "notified - shipped"
            },
            {
              "expr": "sum(rate(notifications_sent_total{type=\"inventory.rejected\"}[5m])) or vector(0)",
              "legendFormat": "notified - rejected"
            }
          ]
        }
      ]
    }
