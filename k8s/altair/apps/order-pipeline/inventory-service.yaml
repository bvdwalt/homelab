apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: inventory-service
  namespace: flux-system
spec:
  releaseName: inventory-service
  targetNamespace: order-pipeline
  values:
    image: ghcr.io/bvdwalt/order-pipeline/inventory-service:0.11.0@sha256:1804211ff0dc7a21b60a3fe98186184f7ebf96322ef65726cda58ed41ce50bcd
    imagePullSecrets:
      - ghcr-pull-secret
    replicas: 2
    port: 8080
    env:
      POSTGRES_HOST: "postgresql.postgresql.svc.cluster.local"
      POSTGRES_USER: "inventory_service"
      POSTGRES_DB: "order_pipeline"
      OTEL_EXPORTER_OTLP_ENDPOINT: "tempo.monitoring.svc.cluster.local:4317"
    existingSecret: order-pipeline-inventory-postgres
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 128Mi
    readinessProbe:
      httpGet:
        path: /healthz
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 6
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8080
      initialDelaySeconds: 15
      periodSeconds: 30
      failureThreshold: 3
    securityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      readOnlyRootFilesystem: true
    # scraped by Prometheus; kafka, postgresql, OTLP to tempo.
    networkPolicy:
      enabled: true
      ingress:
        - fromEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: monitoring
          toPorts:
            - ports:
                - port: "8080"
                  protocol: TCP
      egress:
        - toEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: postgresql
          toPorts:
            - ports:
                - port: "5432"
                  protocol: TCP
        - toEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: kafka
          toPorts:
            - ports:
                - port: "9092"
                  protocol: TCP
        - toEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: monitoring
          toPorts:
            - ports:
                - port: "4317"
                  protocol: TCP
