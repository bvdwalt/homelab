apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lubelogger
  namespace: flux-system
spec:
  releaseName: lubelogger
  targetNamespace: lubelogger
  chart:
    spec:
      chart: ./k8s/charts/homelab-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    image: ghcr.io/hargata/lubelogger:v1.7.3@sha256:c9d2bbb48c7f84d90e54496e2cd60422e56a5f2345c8a539ebe09f77e629d321
    port: 8080
    hostname: lubelogger.greedo.net
    strategy: Recreate
    middlewares:
      - name: infra-admin-oidc-auth
        namespace: kube-system
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 512Mi
    livenessProbe:
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 15
      periodSeconds: 30
      failureThreshold: 3
    env:
      TZ: Africa/Johannesburg
    securityContext:
      enabled: true
      runAsNonRoot: false
      readOnlyRootFilesystem: true
    persistence:
      enabled: true
      size: 1Gi
      mountPath: /App/data
      storageClass: local-path
      accessMode: ReadWriteOnce
    emptyDirs:
      - name: dataprotection-keys
        mountPath: /root/.aspnet/DataProtection-Keys
