apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: actual-importer
  namespace: flux-system
spec:
  releaseName: actual-importer
  targetNamespace: actual-importer
  values:
    image: ghcr.io/bvdwalt/actual-importer:0.9.0@sha256:b19dfc5920eb654ce115feada9907e68a3290e8216b743448f3ee34966012e04
    imagePullSecrets:
      - ghcr-pull-secret
    port: 8080
    hostname: actualimporter.greedo.net
    middlewares:
      - name: personal-oidc-auth
        namespace: kube-system
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 256Mi
    readinessProbe:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 6
    livenessProbe:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 15
      periodSeconds: 30
      failureThreshold: 3
    env:
      ACTUAL_SERVER_URL: "http://actual-budget.actual-budget.svc.cluster.local"
      TZ: "Africa/Johannesburg"
    existingSecret: actual-importer-secrets
    persistence:
      enabled: true
      size: 200Mi
      mountPath: /data
      storageClass: nfs-shared
      accessMode: ReadWriteMany
    securityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      readOnlyRootFilesystem: true
    # glance calls in directly; egress is actual-budget only.
    networkPolicy:
      enabled: true
      ingress:
        - fromEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: glance
          toPorts:
            - ports:
                - port: "8080"
                  protocol: TCP
      egress:
        - toEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: actual-budget
          toPorts:
            - ports:
                - port: "5006"
                  protocol: TCP
