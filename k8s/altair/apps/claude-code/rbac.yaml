# Dedicated ServiceAccount so the RBAC below isn't inherited by anything else
# that runs in the namespace via "default".
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-code
  namespace: claude-code
---
# Read-only cluster access for the claude-code pod's ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-code-view
subjects:
  - kind: ServiceAccount
    name: claude-code
    namespace: claude-code
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
---
# Adds nodes + operator CRDs not aggregated into "view" (e.g. CNPG). Groups
# are enumerated explicitly, not wildcarded, so this can't read Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claude-code-view-extra
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - postgresql.cnpg.io
      - monitoring.coreos.com
      - kafka.strimzi.io
      - traefik.io
      - helm.cattle.io
      - apiextensions.k8s.io
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-code-view-extra
subjects:
  - kind: ServiceAccount
    name: claude-code
    namespace: claude-code
roleRef:
  kind: ClusterRole
  name: claude-code-view-extra
  apiGroup: rbac.authorization.k8s.io
---
# Write access limited to the downloads namespace: exec + port-forward for
# debugging. Not read-only, unlike the bindings above.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: claude-code-downloads-debug
  namespace: downloads
rules:
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claude-code-downloads-debug
  namespace: downloads
subjects:
  - kind: ServiceAccount
    name: claude-code
    namespace: claude-code
roleRef:
  kind: Role
  name: claude-code-downloads-debug
  apiGroup: rbac.authorization.k8s.io
---
# Lets the pod run `flux reconcile` (an annotation patch) on existing Flux
# objects. No create/update/delete, but patch can still edit a spec; Flux
# reverts that drift on its next sync.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: claude-code-flux-reconcile
  namespace: flux-system
rules:
  - apiGroups: [source.toolkit.fluxcd.io]
    resources:
      - gitrepositories
      - helmrepositories
      - helmcharts
      - ocirepositories
      - buckets
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: ["kustomizations"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: ["helmreleases"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claude-code-flux-reconcile
  namespace: flux-system
subjects:
  - kind: ServiceAccount
    name: claude-code
    namespace: claude-code
roleRef:
  kind: Role
  name: claude-code-flux-reconcile
  apiGroup: rbac.authorization.k8s.io
