# Read-only cluster access for the claude-code pod's default ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-code-view
subjects:
  - kind: ServiceAccount
    name: default
    namespace: claude-code
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
