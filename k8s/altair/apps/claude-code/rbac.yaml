# Read-only cluster access for the claude-code pod's default ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-code-view
subjects:
  - kind: ServiceAccount
    name: default
    namespace: claude-code
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
---
# Adds nodes + operator CRDs not aggregated into "view" (e.g. CNPG). Groups
# are enumerated explicitly, not wildcarded, so this can't read Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claude-code-view-extra
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - postgresql.cnpg.io
      - monitoring.coreos.com
      - kafka.strimzi.io
      - traefik.io
      - helm.cattle.io
      - apiextensions.k8s.io
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-code-view-extra
subjects:
  - kind: ServiceAccount
    name: default
    namespace: claude-code
roleRef:
  kind: ClusterRole
  name: claude-code-view-extra
  apiGroup: rbac.authorization.k8s.io
