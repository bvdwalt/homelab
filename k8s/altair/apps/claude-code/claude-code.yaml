apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: claude-code
  namespace: flux-system
spec:
  releaseName: claude-code
  targetNamespace: claude-code
  chart:
    spec:
      chart: ./k8s/charts/homelab-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    image: ghcr.io/bvdwalt/homelab-claude-code:latest@sha256:594c3763c8f9a2da8444361fc497a4c0b9dcbcd45b0b791e5631c94467d852cf
    port: 7681
    hostname: claude.greedo.net
    strategy: Recreate
    serviceAccountName: claude-code
    automountServiceAccountToken: true
    middlewares:
      - name: infra-admin-oidc-auth
        namespace: kube-system
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 1Gi
    livenessProbe:
      httpGet:
        path: /
        port: 7681
      initialDelaySeconds: 15
      periodSeconds: 30
      failureThreshold: 3
    env:
      TZ: Africa/Johannesburg
      GIT_USER_NAME: Barend van der Walt
      GIT_USER_EMAIL: 38956787+bvdwalt@users.noreply.github.com
      REPO_URL: https://github.com/bvdwalt/homelab.git
    existingSecret: claude-code
    securityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      readOnlyRootFilesystem: true
    persistence:
      enabled: true
      size: 2Gi
      mountPath: /home/claude
      storageClass: local-path
      accessMode: ReadWriteOnce
    emptyDirs:
      - name: tmp
        mountPath: /tmp
    # api.anthropic.com confirmed live; github.com confirmed by REPO_URL.
    networkPolicy:
      enabled: true
      egress:
        - toFQDNs:
            - matchName: api.anthropic.com
            - matchName: github.com
            - matchName: api.github.com # gh CLI
            - matchName: platform.claude.com
            - matchName: mcp-proxy.anthropic.com
          toPorts:
            - ports:
                - port: "443"
                  protocol: TCP
        # PromQL queries for alert triage
        - toEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: monitoring
                app.kubernetes.io/name: prometheus
          toPorts:
            - ports:
                - port: "9090"
                  protocol: TCP
