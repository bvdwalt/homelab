apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: claude-code
  namespace: flux-system
spec:
  releaseName: claude-code
  targetNamespace: claude-code
  chart:
    spec:
      chart: ./k8s/charts/homelab-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    image: ghcr.io/bvdwalt/homelab-claude-code:sha-03dbed484c7fcbaab745d97caf9ba17fd96048c2@sha256:250728490abe8c791e10bd4bc1a2d87c3639a676ab20039fa70f7268b3e74b15
    port: 7681
    hostname: claude.greedo.net
    strategy: Recreate
    middlewares:
      - name: infra-admin-oidc-auth
        namespace: kube-system
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 1Gi
    livenessProbe:
      httpGet:
        path: /
        port: 7681
      initialDelaySeconds: 15
      periodSeconds: 30
      failureThreshold: 3
    env:
      TZ: Africa/Johannesburg
      GIT_USER_NAME: Barend van der Walt
      GIT_USER_EMAIL: 38956787+bvdwalt@users.noreply.github.com
      REPO_URL: https://github.com/bvdwalt/homelab.git
    existingSecret: claude-code
    securityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      readOnlyRootFilesystem: true
    persistence:
      enabled: true
      size: 2Gi
      mountPath: /home/claude
      storageClass: local-path
      accessMode: ReadWriteOnce
    emptyDirs:
      - name: tmp
        mountPath: /tmp
