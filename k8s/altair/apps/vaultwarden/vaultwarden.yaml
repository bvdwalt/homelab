apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: flux-system
spec:
  releaseName: vaultwarden
  targetNamespace: vaultwarden
  values:
    image: vaultwarden/server:1.37.2@sha256:094b5689ed81549bd293418395c7cf495ae9d960fc2d4928cef2083ef913d912
    port: 8080
    hostname: vw.greedo.net
    middlewares:
      - name: personal-oidc-auth
        namespace: kube-system
    strategy: Recreate
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 128Mi
    readinessProbe:
      httpGet:
        path: /alive
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 6
    livenessProbe:
      httpGet:
        path: /alive
        port: 8080
      initialDelaySeconds: 15
      periodSeconds: 30
      failureThreshold: 3
    env:
      DOMAIN: "https://vw.greedo.net"
      TZ: "Africa/Johannesburg"
      ROCKET_PORT: "8080"
    persistence:
      enabled: true
      size: 100Mi
      mountPath: /data
    securityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      readOnlyRootFilesystem: true
