apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pocket-id
  namespace: flux-system
spec:
  releaseName: pocket-id
  targetNamespace: pocket-id
  values:
    image: ghcr.io/pocket-id/pocket-id:v2.19.1@sha256:f085157f0b6ea4b2e8aa5ecfd99eada0d83a4960f3a3dcfd46014097d0ef7ab5
    port: 1411
    hostname: pocketid.greedo.net
    strategy: Recreate
    priorityClassName: system-cluster-critical
    resources:
      requests:
        memory: 16Mi
      limits:
        memory: 64Mi
    livenessProbe:
      httpGet:
        path: /
        port: 1411
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 3
    env:
      APP_URL: "https://pocketid.greedo.net"
      TRUST_PROXY: "true"
      TZ: "Africa/Johannesburg"
      ANALYTICS_DISABLED: "true"
    middlewares: []
    existingSecret: pocket-id-secrets
    persistence:
      enabled: true
      size: 100Mi
      mountPath: /app/data
    securityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 3004
      runAsGroup: 3004
      readOnlyRootFilesystem: true
    networkPolicy:
      enabled: true
