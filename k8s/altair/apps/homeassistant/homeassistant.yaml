apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homeassistant
  namespace: flux-system
spec:
  releaseName: homeassistant
  targetNamespace: homeassistant
  values:
    image: homeassistant/home-assistant:2026.10.4@sha256:23f4dfbb69ce76315dbc4de7915504f1c2dcecd7ca2648113a493a385972e133
    strategy: Recreate
    port: 8123
    hostname: homeassistant.greedo.net
    middlewares: []
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 1Gi
    readinessProbe:
      httpGet:
        path: /manifest.json
        port: 8123
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 12
    livenessProbe:
      httpGet:
        path: /manifest.json
        port: 8123
      initialDelaySeconds: 60
      periodSeconds: 30
      failureThreshold: 3
    persistence:
      enabled: true
      mountPath: /config
      size: 2Gi
      storageClass: nfs-shared
      accessMode: ReadWriteOnce
    securityContext:
      enabled: true
      runAsNonRoot: false
      capabilities:
        add:
          - CHOWN
          - SETUID
          - SETGID
          - DAC_OVERRIDE
    configMountPath: /config
    configFiles:
      configuration.yaml: |
        # Loads default set of integrations. Do not remove.
        default_config:

        # Load frontend themes from the themes folder
        frontend:
          themes: !include_dir_merge_named themes

        automation: !include automations.yaml
        script: !include scripts.yaml
        scene: !include scenes.yaml

        # Traefik runs in the pod network; HA rejects proxied requests otherwise.
        http:
          use_x_forwarded_for: true
          trusted_proxies:
            - 10.42.0.0/16 # pod CIDR (ipv4NativeRoutingCIDR in cilium.yaml)
    # glance calls in directly; egress only for the met.no weather entity.
    networkPolicy:
      enabled: true
      ingress:
        - fromEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: glance
          toPorts:
            - ports:
                - port: "8123"
                  protocol: TCP
      egress:
        - toFQDNs:
            - matchName: api.met.no
            - matchPattern: "*.api.met.no"
          toPorts:
            - ports:
                - port: "443"
                  protocol: TCP
