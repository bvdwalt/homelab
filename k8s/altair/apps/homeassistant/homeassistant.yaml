apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homeassistant
  namespace: flux-system
spec:
  releaseName: homeassistant
  targetNamespace: homeassistant
  values:
    image: homeassistant/home-assistant:2026.9.2@sha256:a1bc133af84ee6505fe2c266d9805b7c75b780dfdc188edfee3b11e8f3cd8efe
    strategy: Recreate
    port: 8123
    hostname: homeassistant.greedo.net
    middlewares:
      - name: personal-oidc-auth
        namespace: kube-system
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 1Gi
    readinessProbe:
      httpGet:
        path: /manifest.json
        port: 8123
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 12
    livenessProbe:
      httpGet:
        path: /manifest.json
        port: 8123
      initialDelaySeconds: 60
      periodSeconds: 30
      failureThreshold: 3
    persistence:
      enabled: true
      mountPath: /config
      size: 2Gi
      storageClass: nfs-shared
      accessMode: ReadWriteOnce
    securityContext:
      enabled: true
      runAsNonRoot: false
      capabilities:
        add:
          - CHOWN
          - SETUID
          - SETGID
          - DAC_OVERRIDE
    configMountPath: /config
    configFiles:
      configuration.yaml: |
        # Loads default set of integrations. Do not remove.
        default_config:

        # Load frontend themes from the themes folder
        frontend:
          themes: !include_dir_merge_named themes

        automation: !include automations.yaml
        script: !include scripts.yaml
        scene: !include scenes.yaml

        http:
          use_x_forwarded_for: true
          trusted_proxies:
            - 10.42.0.0/24
