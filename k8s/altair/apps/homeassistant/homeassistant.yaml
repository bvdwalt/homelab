apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homeassistant
  namespace: flux-system
spec:
  releaseName: homeassistant
  targetNamespace: homeassistant
  values:
    image: homeassistant/home-assistant:2026.10.0@sha256:1b64d38f38d922bf9d59336451fd6453e1d614f934456af4ee3d2a51061be3a4
    strategy: Recreate
    port: 8123
    hostname: homeassistant.greedo.net
    middlewares:
      - name: personal-oidc-auth
        namespace: kube-system
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 1Gi
    readinessProbe:
      httpGet:
        path: /manifest.json
        port: 8123
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 12
    livenessProbe:
      httpGet:
        path: /manifest.json
        port: 8123
      initialDelaySeconds: 60
      periodSeconds: 30
      failureThreshold: 3
    persistence:
      enabled: true
      mountPath: /config
      size: 2Gi
      storageClass: nfs-shared
      accessMode: ReadWriteOnce
    securityContext:
      enabled: true
      runAsNonRoot: false
      capabilities:
        add:
          - CHOWN
          - SETUID
          - SETGID
          - DAC_OVERRIDE
    configMountPath: /config
    configFiles:
      configuration.yaml: |
        # Loads default set of integrations. Do not remove.
        default_config:

        # Load frontend themes from the themes folder
        frontend:
          themes: !include_dir_merge_named themes

        automation: !include automations.yaml
        script: !include scripts.yaml
        scene: !include scenes.yaml
    # glance calls in directly; egress intentionally not allowed, see commit.
    networkPolicy:
      enabled: true
      ingress:
        - fromEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: glance
          toPorts:
            - ports:
                - port: "8123"
                  protocol: TCP
