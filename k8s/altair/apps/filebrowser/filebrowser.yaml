apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: filebrowser
  namespace: flux-system
spec:
  releaseName: filebrowser
  targetNamespace: filebrowser
  chart:
    spec:
      chart: ./k8s/charts/homelab-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    image: filebrowser/filebrowser:v2.63.23@sha256:a469ea076d4a1b4b1d86a41d130f2f536cd9da996a2b1fb39c0d7635f9d89b9a
    port: 80
    hostname: filebrowser.greedo.net
    strategy: Recreate
    middlewares:
      - name: infra-admin-oidc-auth
        namespace: kube-system
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 256Mi
    livenessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 15
      periodSeconds: 30
      failureThreshold: 3
    env:
      TZ: Africa/Johannesburg
    securityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      readOnlyRootFilesystem: true
    args:
      - -d
      - /db/filebrowser.db
      - -p
      - "80"
      - -a
      - "0.0.0.0"
    persistence:
      enabled: true
      size: 100Mi
      mountPath: /db
      storageClass: local-path
      accessMode: ReadWriteOnce
    hostPaths:
      - name: music
        hostPath: /mnt/media/music
        mountPath: /srv/music
