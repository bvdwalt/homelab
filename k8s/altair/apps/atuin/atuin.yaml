apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: atuin
  namespace: flux-system
spec:
  releaseName: atuin
  targetNamespace: atuin
  values:
    image: ghcr.io/atuinsh/atuin:18.18.1@sha256:8573bcd8343325e3de6f8322787881faeb9e82bee703b5969a55005b69d62e24
    port: 8888
    hostname: atuin.greedo.net
    args:
      - start
    env:
      ATUIN_HOST: "0.0.0.0"
      ATUIN_PORT: "8888"
      ATUIN_OPEN_REGISTRATION: "false"
      TZ: "Europe/Amsterdam"
    resources:
      requests:
        memory: 8Mi
      limits:
        memory: 64Mi
    readinessProbe:
      tcpSocket:
        port: 8888
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 6
    livenessProbe:
      tcpSocket:
        port: 8888
      initialDelaySeconds: 15
      periodSeconds: 30
      failureThreshold: 3
    middlewares: []
    existingSecret: atuin
    persistence:
      enabled: true
      mountPath: /config
    securityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 3013
      runAsGroup: 3013
