apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: atuin
  namespace: flux-system
spec:
  releaseName: atuin
  targetNamespace: atuin
  values:
    image: ghcr.io/atuinsh/atuin:18.21.0@sha256:38c6c323c6d3864250dc345dcf9d41b7a408ee6e33a7cc3cde44b6ffe9f64a02
    port: 8888
    hostname: atuin.greedo.net
    args:
      - start
    env:
      ATUIN_HOST: "0.0.0.0"
      ATUIN_PORT: "8888"
      ATUIN_OPEN_REGISTRATION: "false"
      TZ: "Africa/Johannesburg"
    resources:
      requests:
        memory: 8Mi
      limits:
        memory: 64Mi
    readinessProbe:
      tcpSocket:
        port: 8888
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 6
    livenessProbe:
      tcpSocket:
        port: 8888
      initialDelaySeconds: 15
      periodSeconds: 30
      failureThreshold: 3
    middlewares: []
    existingSecret: atuin
    persistence:
      enabled: true
      mountPath: /config
      storageClass: nfs-shared
      accessMode: ReadWriteMany
    securityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 3013
      runAsGroup: 3013
      readOnlyRootFilesystem: true
