theme:
  background-color: 240 21 15
  contrast-multiplier: 1.2
  primary-color: 217 92 83
  positive-color: 115 54 76
  negative-color: 347 70 65

pages:
  - name: Home
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h
            timezones:
              - timezone: Africa/Johannesburg
                label: Cape Town
              - timezone: Asia/Dubai
                label: Dubai
              - timezone: Europe/Tallinn
                label: Tallinn
              - timezone: UTC
                label: UTC

          - type: to-do

          - type: calendar
            first-day-of-week: monday

          - type: weather
            location: Cape Town, South Africa
            units: metric
            hour-format: 24h

          - type: weather
            location: Dubai, United Arab Emirates
            units: metric
            hour-format: 24h

          - type: weather
            location: Tallinn, Estonia
            units: metric
            hour-format: 24h

          - type: search
            search-engine: https://www.ecosia.org/search?q={QUERY}
            new-tab: true

          - type: bookmarks
            groups:
              - title: Developer
                links:
                  - title: GitHub
                    url: https://github.com/
              - title: Social
                links:
                  - title: Reddit
                    url: https://reddit.com/
                  - title: YouTube
                    url: https://youtube.com/

      - size: full
        widgets:
          - type: server-stats
            servers:
              - type: local
                name: Altair
                mountpoints:
                  "/":
                    name: Root

          - type: dns-stats
            service: adguard
            url: http://adguard.adguard.svc.cluster.local
            username: ${ADGUARD_USERNAME}
            password: ${ADGUARD_PASSWORD}
            hour-format: 24h
            hide-graph: true

          - type: monitor
            title: Services
            sites:
              - title: Jellyfin
                url: https://jellyfin.greedo.net
                check-url: http://jellyfin.jellyfin.svc.cluster.local/health
                icon: si:jellyfin
              - title: Navidrome — Music streaming
                url: https://navidrome.greedo.net
                check-url: http://navidrome.navidrome.svc.cluster.local/
                icon: di:navidrome
              - title: Seerr — Media requests
                url: https://seerr.greedo.net
                check-url: http://seerr.seerr.svc.cluster.local/
                icon: di:seerr
              - title: Jellystat — Jellyfin stats
                url: https://jellystat.greedo.net
                check-url: http://jellystat.jellystat.svc.cluster.local/auth/isConfigured
              - title: Tdarr — Media transcoding
                url: https://tdarr.greedo.net
                check-url: http://tdarr.tdarr.svc.cluster.local/
              - title: Sonarr — TV shows
                url: https://sonarr.greedo.net
                icon: si:sonarr
              - title: Radarr — Movies
                url: https://radarr.greedo.net
                icon: si:radarr
              - title: Bazarr — Subtitles
                url: https://bazarr.greedo.net
                icon: di:bazarr
              - title: Lidarr — Music downloads
                url: https://lidarr.greedo.net
                icon: di:lidarr
              - title: Prowlarr — Indexers
                url: https://prowlarr.greedo.net
                icon: di:prowlarr
              - title: qBittorrent — Torrents
                url: https://downloads.greedo.net
                icon: si:qbittorrent
              - title: slskd — Soulseek
                url: https://slskd.greedo.net
                icon: di:slskd
              - title: Overdrive
                url: https://overdrive.greedo.net
                check-url: http://overdrive.overdrive.svc.cluster.local/
              - title: Music Grabber
                url: https://musicgrabber.greedo.net
              - title: Proxmox — Virtualisation
                url: https://pve.greedo.net
                check-url: https://10.0.0.166:8006
                allow-insecure: true
                icon: si:proxmox
              - title: Traefik — Reverse proxy
                url: https://traefik.greedo.net
                icon: si:traefikproxy
              - title: AdGuard Home — DNS / Ad blocking
                url: https://adguard.greedo.net
                check-url: http://adguard.adguard.svc.cluster.local/
                icon: si:adguard
              - title: Gitea — Git hosting
                url: https://gitea.greedo.net
                check-url: http://gitea-http.gitea.svc.cluster.local:3000/api/healthz
                icon: si:gitea
              - title: Pocket-ID — SSO
                url: https://pocketid.greedo.net
                icon: di:pocket-id
              - title: Vaultwarden — Passwords
                url: https://vw.greedo.net
                icon: si:vaultwarden
              - title: Grafana — Metrics
                url: https://grafana.greedo.net
                check-url: http://prometheus-grafana.monitoring.svc.cluster.local/api/health
                icon: si:grafana
              - title: Backrest — Backups
                url: https://backrest.greedo.net
                check-url: http://backrest.backrest.svc.cluster.local/
                icon: di:backrest
              - title: IT Tools — Dev utilities
                url: https://ittools.greedo.net
                check-url: http://it-tools.it-tools.svc.cluster.local/
                icon: di:it-tools
              - title: ActualBudget — Budgeting
                url: https://budget.greedo.net
                check-url: http://actual-budget.actual-budget.svc.cluster.local/
                icon: si:actualbudget
              - title: Palimpsest — Notes
                url: https://notes.greedo.net
                check-url: http://palimpsest.palimpsest.svc.cluster.local/
              - title: Metering
                url: https://metering.greedo.net
                check-url: http://metering-dashboard.metering.svc.cluster.local/
              - title: Pyroscope — Profiling
                url: https://pyroscope.greedo.net
                check-url: http://pyroscope.monitoring.svc.cluster.local:4040/
                icon: si:grafana
              - title: Actual Importer — Budget imports
                url: https://actualimporter.greedo.net
                check-url: http://actual-importer.actual-importer.svc.cluster.local/health

          - type: repository
            repository: bvdwalt/homelab
            pull-requests-limit: 5
            issues-limit: 5
            commits-limit: 5

          - type: releases
            show-source-icon: true
            collapse-after: 5
            repositories:
              - glanceapp/glance
              - jellyfin/jellyfin
              - Sonarr/Sonarr
              - Radarr/Radarr
              - lidarr/Lidarr
              - morpheus65535/bazarr
              - Prowlarr/Prowlarr
              - navidrome/navidrome
              - dani-garcia/vaultwarden
              - go-gitea/gitea
              - AdguardTeam/AdGuardHome
              - henrygd/beszel
              - garethgeorge/backrest
              - slskd/slskd
              - bvdwalt/palimpsest
              - bvdwalt/cullarr
              - bvdwalt/overdrive
              - actualbudget/actual
              - atuinsh/atuin
              - filebrowser/filebrowser
              - CorentinTh/it-tools
              - CyferShepard/Jellystat
              - pocket-id/pocket-id
              - seerr-team/seerr
              - HaveAGitGat/Tdarr
              - FlareSolverr/FlareSolverr
              - qdm12/gluetun
              - Dictionarry-Hub/profilarr
              - qbittorrent/qBittorrent

