apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: glance
  namespace: flux-system
spec:
  releaseName: glance
  targetNamespace: glance
  values:
    image: glanceapp/glance:v0.8.6@sha256:9dfb09470b207dcb67ac715994bdb1929374ba3f9c0d7df7462c24adf10fd073
    port: 8080
    hostname: home.greedo.net
    middlewares:
      - name: household-oidc-auth
        namespace: kube-system
    livenessProbe:
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 5
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 128Mi
    existingSecret: glance-secrets
    existingConfigMap: glance-config
    configMountPath: /app/config
    configKeys:
      - glance.yml
    securityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      readOnlyRootFilesystem: true
