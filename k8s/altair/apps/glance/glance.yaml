apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: glance
  namespace: flux-system
spec:
  releaseName: glance
  targetNamespace: glance
  values:
    image: glanceapp/glance:v0.8.6@sha256:9dfb09470b207dcb67ac715994bdb1929374ba3f9c0d7df7462c24adf10fd073
    port: 8080
    hostname: home.greedo.net
    middlewares:
      - name: household-oidc-auth
        namespace: kube-system
    livenessProbe:
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 5
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 128Mi
    existingSecret: glance-secrets
    existingConfigMap: glance-config
    configMountPath: /app/config
    configKeys:
      - glance.yml
    securityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      readOnlyRootFilesystem: true
    # Egress needs confirmed via conntrack + glance.yml's monitor/dns-stats/weather/releases widgets.
    networkPolicy:
      enabled: true
      egress:
        - toFQDNs:
            - matchName: api.github.com
            - matchPattern: "*.open-meteo.com"
          toPorts:
            - ports:
                - port: "443"
                  protocol: TCP
        # Proxmox (LAN, no hostname in config)
        - toCIDR:
            - 10.0.0.166/32
          toPorts:
            - ports:
                - port: "8006"
                  protocol: TCP
        # netboot.xyz (LAN, no hostname in config)
        - toCIDR:
            - 10.0.0.167/32
          toPorts:
            - ports:
                - port: "3000"
                  protocol: TCP
        - toEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: palimpsest
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: overdrive
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: adguard
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: actual-importer
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: lubelogger
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: kafka
          toPorts:
            - ports:
                - port: "8080"
                  protocol: TCP
        - toEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: homeassistant
          toPorts:
            - ports:
                - port: "8123"
                  protocol: TCP
        - toEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: downloads
          toPorts:
            - ports:
                - port: "80"
                  protocol: TCP
        - toEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: gitea
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: jellystat
          toPorts:
            - ports:
                - port: "3000"
                  protocol: TCP
        - toEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: metering
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: it-tools
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: monitoring
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: filebrowser
          toPorts:
            - ports:
                - port: "80"
                  protocol: TCP
        - toEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: jellyfin
          toPorts:
            - ports:
                - port: "8096"
                  protocol: TCP
        - toEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: tdarr
          toPorts:
            - ports:
                - port: "8265"
                  protocol: TCP
        - toEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: seerr
          toPorts:
            - ports:
                - port: "5055"
                  protocol: TCP
        - toEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: actual-budget
          toPorts:
            - ports:
                - port: "5006"
                  protocol: TCP
        - toEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: monitoring
          toPorts:
            - ports:
                - port: "4040"
                  protocol: TCP
        - toEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: backrest
          toPorts:
            - ports:
                - port: "9898"
                  protocol: TCP
        - toEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: navidrome
          toPorts:
            - ports:
                - port: "4533"
                  protocol: TCP
        # Apps without a check-url: the public URL via Traefik is checked instead.
        - toEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: kube-system
          toPorts:
            - ports:
                - port: "8443"
                  protocol: TCP
