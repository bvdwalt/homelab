apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: degoog
  namespace: flux-system
spec:
  releaseName: degoog
  targetNamespace: degoog
  values:
    image: ghcr.io/degoog-org/degoog:1.1.0@sha256:4b5d1eda19da3591782142bd30c367a3973aaf2511a7d050b852a53f1045a5d1
    port: 4444
    hostname: goog.greedo.net
    strategy: Recreate
    middlewares:
      - name: household-oidc-auth
        namespace: kube-system
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 512Mi
    livenessProbe:
      httpGet:
        path: /
        port: 4444
      initialDelaySeconds: 15
      periodSeconds: 30
      failureThreshold: 3
    env:
      TZ: Africa/Johannesburg
      DEGOOG_WIZARD: "false"
    securityContext:
      enabled: true
      capabilities:
        add: [CHOWN, SETUID, SETGID]
    existingSecret: degoog
    persistence:
      enabled: true
      size: 1Gi
      mountPath: /app/data
      storageClass: local-path
      accessMode: ReadWriteOnce
    # glance calls in directly. Egress covers the enabled engines (ddg web/images/news,
    # ecosia, google web/images/videos, reddit, wikipedia), favicons and the github store.
    networkPolicy:
      enabled: true
      ingress:
        - fromEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: glance
          toPorts:
            - ports:
                - port: "4444"
                  protocol: TCP
      egress:
        - toFQDNs:
            - matchName: github.com
            - matchName: duckduckgo.com
            - matchName: html.duckduckgo.com
            - matchName: icons.duckduckgo.com
            - matchName: www.ecosia.org
            - matchName: www.google.com
            - matchName: suggestqueries.google.com
            - matchPattern: "*.gstatic.com"
            - matchName: i.ytimg.com
            - matchName: www.reddit.com
            - matchPattern: "*.wikipedia.org"
          toPorts:
            - ports:
                - port: "443"
                  protocol: TCP
