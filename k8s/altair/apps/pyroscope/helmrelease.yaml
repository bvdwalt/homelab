apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pyroscope
  namespace: flux-system
spec:
  interval: 30m
  releaseName: pyroscope
  targetNamespace: monitoring
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: pyroscope
      version: "2.2.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 1h
  values:
    pyroscope:
      replicaCount: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
      persistence:
        enabled: true
        size: 10Gi
    minio:
      enabled: false
    architecture:
      microservices:
        enabled: false
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: StatefulSet
              name: pyroscope
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/livenessProbe
                value:
                  httpGet:
                    path: /ready
                    port: http2
                  initialDelaySeconds: 60
                  periodSeconds: 15
                  failureThreshold: 6
