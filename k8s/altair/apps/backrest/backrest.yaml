apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: backrest
  namespace: flux-system
spec:
  releaseName: backrest
  targetNamespace: backrest
  install:
    createNamespace: false
  values:
    image: ghcr.io/garethgeorge/backrest:v1.14.1@sha256:8c717ba795263a1802696aacce7c4e05cfbee98af80b4806ff166e6e18bde944
    strategy: Recreate
    resources:
      requests:
        memory: 16Mi
      limits:
        memory: 512Mi
    livenessProbe:
      httpGet:
        path: /
        port: 9898
      initialDelaySeconds: 15
      periodSeconds: 30
      failureThreshold: 3
    port: 9898
    hostname: backrest.greedo.net
    middlewares:
      - name: infra-admin-oidc-auth
        namespace: kube-system
    env:
      BACKREST_PORT: "0.0.0.0:9898"
      BACKREST_DATA: /data
      BACKREST_CONFIG: /data/config.json
      XDG_CACHE_HOME: /data/cache
      TZ: Africa/Johannesburg
    existingSecret: backrest
    extraSecrets:
      - postgresql-superuser-backrest
      - ntfy-backrest
    persistence:
      enabled: true
      size: 1Gi
      mountPath: /data
    securityContext:
      capabilities:
        add: [DAC_READ_SEARCH]
    existingConfigMap: backrest-scripts
    configKeys: [excludes.txt, sync-excludes.py, diff-summary.py, pg-dump.sh, pre-backup.sh, post-backup.sh, notify-failure.sh, config-template.json, restore-config.py, extract-config.py]
    configMountPath: /scripts
    extraContainers:
      - name: scripts
        image: postgres:18-alpine@sha256:63bdc97d67b5133bf0e5ebd500bec6d046fa851dc81340d838f0347e616107e8
        command: [sh, -c, "apk add --no-cache restic rclone python3 curl && sleep infinity"]
        envFrom:
          - secretRef:
              name: backrest
          - secretRef:
              name: postgresql-superuser-backrest
              optional: true
        volumeMounts:
          - name: data
            mountPath: /data
          - name: config
            mountPath: /scripts
    initContainers:
      - name: restore-config
        image: python:3.14-alpine@sha256:0ad7f98a97b1b8fcc226f5cbe49f0b95cd6f624582cdc6fbf7e41312075cb401
        command: [python3, /scripts/restore-config.py]
        envFrom:
          - secretRef:
              name: backrest
        volumeMounts:
          - name: data
            mountPath: /data
          - name: config
            mountPath: /scripts
      - name: sync-excludes
        image: python:3.14-alpine@sha256:0ad7f98a97b1b8fcc226f5cbe49f0b95cd6f624582cdc6fbf7e41312075cb401
        command: [python3, /scripts/sync-excludes.py]
        volumeMounts:
          - name: data
            mountPath: /data
          - name: config
            mountPath: /scripts
    hostPaths:
      - name: pvcs
        hostPath: /var/lib/rancher/k3s/storage
        mountPath: /pvcs
        readOnly: true
      - name: nfs-pvcs
        hostPath: /mnt/k8s-nfs
        mountPath: /nfs-pvcs
        readOnly: true
