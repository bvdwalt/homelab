apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: backrest
  namespace: flux-system
spec:
  releaseName: backrest
  targetNamespace: backrest
  install:
    createNamespace: false
  values:
    image: ghcr.io/bvdwalt/homelab-backrest:sha-eda7493b62d9f0e56c8284338a2970cce268b0da@sha256:5d7e59edd8b21f57c5468d49940b4c81072603a24921d7115f416a53051b3243
    strategy: Recreate
    resources:
      requests:
        memory: 16Mi
      limits:
        memory: 512Mi
    livenessProbe:
      httpGet:
        path: /
        port: 9898
      initialDelaySeconds: 15
      periodSeconds: 30
      failureThreshold: 3
    port: 9898
    hostname: backrest.greedo.net
    middlewares:
      - name: infra-admin-oidc-auth
        namespace: kube-system
    env:
      BACKREST_PORT: "0.0.0.0:9898"
      BACKREST_DATA: /data
      BACKREST_CONFIG: /data/config.json
      XDG_CACHE_HOME: /data/cache
      TZ: Africa/Johannesburg
    existingSecret: backrest
    extraSecrets:
      - postgresql-superuser-backrest
      - ntfy-backrest
    persistence:
      enabled: true
      size: 1Gi
      mountPath: /data
    securityContext:
      readOnlyRootFilesystem: true
    emptyDirs:
      - name: tmp
        mountPath: /tmp
    existingConfigMap: backrest-scripts
    configKeys: [excludes.txt, sync-excludes.py, diff-summary.py, pg-dump.sh, pre-backup.sh, post-backup.sh, notify-failure.sh, config-template.json, restore-config.py, extract-config.py]
    configMountPath: /scripts
    extraContainers:
      - name: scripts
        image: ghcr.io/bvdwalt/homelab-backrest-scripts:sha-eda7493b62d9f0e56c8284338a2970cce268b0da@sha256:a7b970124002b9a803ff5de3e58a38fa0959ec3ba5a65c9076d94f6c50427610
        command: [sleep, infinity]
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        envFrom:
          - secretRef:
              name: backrest
          - secretRef:
              name: postgresql-superuser-backrest
              optional: true
        volumeMounts:
          - name: data
            mountPath: /data
          - name: config
            mountPath: /scripts
    initContainers:
      - name: fix-data-perms
        image: python:3.14-alpine@sha256:0ad7f98a97b1b8fcc226f5cbe49f0b95cd6f624582cdc6fbf7e41312075cb401
        command: [chown, -R, "1000:1000", /data]
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
            add: [CHOWN, DAC_OVERRIDE]
        volumeMounts:
          - name: data
            mountPath: /data
      - name: restore-config
        image: python:3.14-alpine@sha256:0ad7f98a97b1b8fcc226f5cbe49f0b95cd6f624582cdc6fbf7e41312075cb401
        command: [python3, /scripts/restore-config.py]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        envFrom:
          - secretRef:
              name: backrest
        volumeMounts:
          - name: data
            mountPath: /data
          - name: config
            mountPath: /scripts
      - name: sync-excludes
        image: python:3.14-alpine@sha256:0ad7f98a97b1b8fcc226f5cbe49f0b95cd6f624582cdc6fbf7e41312075cb401
        command: [python3, /scripts/sync-excludes.py]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
          - name: data
            mountPath: /data
          - name: config
            mountPath: /scripts
    hostPaths:
      - name: pvcs
        hostPath: /var/lib/rancher/k3s/storage
        mountPath: /pvcs
        readOnly: true
      - name: nfs-pvcs
        hostPath: /mnt/k8s-nfs
        mountPath: /nfs-pvcs
        readOnly: true
