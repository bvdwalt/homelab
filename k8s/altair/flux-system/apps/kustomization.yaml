apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - whoami.yaml
  - downloads.yaml
  - postgresql.yaml
  - gitea.yaml
  - monitoring.yaml
  - seerr.yaml
  - navidrome.yaml
  - it-tools.yaml
  - jellystat.yaml
  - metering-dashboard.yaml
  - metering-api.yaml
  - actual-budget.yaml
  - atuin.yaml
  - overdrive.yaml
  - vaultwarden.yaml
  - pocket-id.yaml
  - cullarr.yaml
  - backrest.yaml
  - adguard.yaml
  - filebrowser.yaml
  - jellyfin.yaml
  - glance.yaml
  - palimpsest.yaml
  - actual-importer.yaml
  - pyroscope.yaml
  - maintenance-page.yaml
  - tdarr.yaml
  - lubelogger.yaml
  - homeassistant.yaml
  - mosquitto.yaml
  - kafka.yaml
  - order-pipeline.yaml
  - claude-code.yaml
  - tempo.yaml
  - netboot-xyz.yaml
  - degoog.yaml
  - spotter.yaml
patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
    patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: placeholder
        namespace: flux-system
      spec:
        interval: 10m
        timeout: 5m
        retryInterval: 2m
        prune: true
        wait: true
        sourceRef:
          kind: GitRepository
          name: flux-system
        decryption:
          provider: sops
          secretRef:
            name: sops-age
        dependsOn:
          - name: infrastructure-secrets
          - name: infrastructure-configs
          - name: namespaces
  # Overrides to the default dependsOn above.
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: ^(pyroscope|tempo)$
    patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: placeholder
        namespace: flux-system
      spec:
        dependsOn:
          - name: infrastructure-secrets
          - name: infrastructure-configs
          - name: monitoring
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: ^order-pipeline$
    patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: placeholder
        namespace: flux-system
      spec:
        dependsOn:
          - name: infrastructure-secrets
          - name: infrastructure-configs
          - name: namespaces
          - name: kafka
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: ^namespaces$
    patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: placeholder
        namespace: flux-system
      spec:
        dependsOn: null
