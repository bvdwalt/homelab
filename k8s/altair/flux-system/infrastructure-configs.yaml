apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-configs
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  retryInterval: 2m
  path: ./k8s/altair/infrastructure/configs
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure-releases
    - name: infrastructure-secrets
  postBuild:
    substituteFrom:
      - kind: Secret
        name: downloads-oidc-auth
      - kind: Secret
        name: infra-admin-oidc-auth
      - kind: Secret
        name: household-oidc-auth
      - kind: Secret
        name: personal-oidc-auth
      - kind: Secret
        name: crowdsec-bouncer-key
