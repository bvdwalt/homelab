apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: strimzi-operator
  namespace: kafka
spec:
  interval: 30m
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: strimzi-kafka-operator
      version: "1.3.1"
      sourceRef:
        kind: HelmRepository
        name: strimzi
        namespace: flux-system
      interval: 1h
  values:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 384Mi
