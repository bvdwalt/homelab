apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: strimzi-operator
  namespace: kafka
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: strimzi-kafka-operator
      version: "1.2.0"
      sourceRef:
        kind: HelmRepository
        name: strimzi
        namespace: flux-system
      interval: 1h
  values:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 384Mi
