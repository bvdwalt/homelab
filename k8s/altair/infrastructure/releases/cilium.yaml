apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: "1.20.2"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # TEMP: log-only, don't enforce, while auditing the new default-deny netpol.
    policyAuditMode: true
    hostFirewall:
      enabled: true
    kubeProxyReplacement: true
    # node IP for LoadBalancer services with class io.cilium/node
    nodeIPAM:
      enabled: true
    k8sServiceHost: 10.0.0.167
    k8sServicePort: 6443
    routingMode: native
    ipv4NativeRoutingCIDR: 10.42.0.0/16
    ipam:
      mode: kubernetes
    bpf:
      masquerade: true
    operator:
      replicas: 1
    hubble:
      enabled: true
      metrics:
        enableOpenMetrics: true
        # No ip fallback: peer IPs (torrents) would explode cardinality, they land in "world".
        enabled:
          - "dns:query;ignoreAAAA;sourceContext=workload-name|reserved-identity"
          - "drop:sourceContext=workload-name|reserved-identity;destinationContext=dns|workload-name|reserved-identity"
          - tcp
          - "flow:sourceContext=workload-name|reserved-identity;destinationContext=dns|workload-name|reserved-identity"
          - port-distribution
          - httpV2
        serviceMonitor:
          enabled: true
          interval: 30s
          labels:
            release: prometheus
      relay:
        enabled: true
      ui:
        enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true
        # Prometheus only selects ServiceMonitors labelled release=prometheus.
        labels:
          release: prometheus
