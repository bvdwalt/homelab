apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-actions-flux-reconcile
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-actions-flux-reconcile
  namespace: flux-system
rules:
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories"]
    resourceNames: ["flux-system"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions-flux-reconcile
  namespace: flux-system
subjects:
  - kind: ServiceAccount
    name: github-actions-flux-reconcile
    namespace: flux-system
roleRef:
  kind: Role
  name: github-actions-flux-reconcile
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: github-actions-flux-reconcile-token
  namespace: flux-system
  annotations:
    kubernetes.io/service-account.name: github-actions-flux-reconcile
type: kubernetes.io/service-account-token
