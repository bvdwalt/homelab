# Not enforcing: relies on cluster-wide policyAuditMode in cilium.yaml, logs via Hubble.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny-app-namespaces
spec:
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: NotIn
        values:
          - kube-system
          - flux-system
          - cert-manager
          - crowdsec
          - traefik-config
          - intel-gpu-plugin
  # Must be non-empty to engage ingress enforcement at all (unlike k8s NetworkPolicy's `[]`).
  ingress:
    - fromEntities:
        - health
  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Kubernetes API server + Cilium health checks
    - toEntities:
        - kube-apiserver
        - health
