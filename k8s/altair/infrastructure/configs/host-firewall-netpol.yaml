# Host-level policy (reserved:host). Audit-only while policyAuditMode is on.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-firewall
spec:
  nodeSelector: {}
  ingress:
    # netboot-xyz: web UI, nginx assets, TFTP (PXE clients on the LAN)
    - toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
            - port: "80"
              protocol: TCP
            - port: "69"
              protocol: UDP
    # sshd
    - fromCIDR:
        - 10.0.0.0/24
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
    # kube-apiserver: LAN workstation + in-cluster clients
    - fromCIDR:
        - 10.0.0.0/24
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # kubelet, node-exporter, cilium/hubble metrics: prometheus, metrics-server
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
            - port: "9100"
              protocol: TCP
            - port: "9962"
              protocol: TCP
            - port: "9963"
              protocol: TCP
            - port: "9965"
              protocol: TCP
            - port: "4244"
              protocol: TCP
    # cilium-health probes
    - fromEntities:
        - health
        - remote-node
      toPorts:
        - ports:
            - port: "4240"
              protocol: TCP
