apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    priorityClassName: system-cluster-critical
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
    logs:
      access:
        enabled: true
        format: json
    experimental:
      plugins:
        traefik-oidc-auth:
          moduleName: github.com/sevensolutions/traefik-oidc-auth
          version: v0.12.0
        crowdsec-bouncer:
          moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
          version: v1.4.5
    additionalArguments:
      - "--entrypoints.websecure.http.middlewares=traefik-config-crowdsec-bouncer@kubernetescrd,traefik-config-nice-404@kubernetescrd,traefik-config-maintenance-page-errors@kubernetescrd"
    deployment:
      additionalVolumes:
        - name: plugins
          hostPath:
            path: /var/lib/traefik-plugins
            type: DirectoryOrCreate
      initContainers:
        - name: wait-for-dns
          image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command:
            - sh
            - -c
            - until nslookup kubernetes.default.svc.cluster.local; do echo waiting for cluster DNS; sleep 2; done
        - name: plugins-permissions
          image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command:
            - sh
            - -c
            - chown -R 65532:65532 /plugins-storage
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: plugins
              mountPath: /plugins-storage
    additionalVolumeMounts:
      - name: plugins
        mountPath: /plugins-storage
