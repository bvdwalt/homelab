apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: HelmRelease
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: placeholder
        namespace: flux-system
      spec:
        install:
          remediation:
            retries: 3
        upgrade:
          cleanupOnFail: true
          remediation:
            retries: 3
