apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: backrest
  namespace: flux-system
spec:
  releaseName: backrest
  targetNamespace: backrest
  install:
    createNamespace: false
  values:
    image: ghcr.io/garethgeorge/backrest:v1.14.1@sha256:dbf2118de71591f96c996acf5ac2292741d3f536829d0ca58c08558ab59f4e49
    strategy: Recreate
    resources:
      requests:
        memory: 16Mi
      limits:
        memory: 128Mi
    livenessProbe:
      httpGet:
        path: /
        port: 9898
      initialDelaySeconds: 15
      periodSeconds: 30
      failureThreshold: 3
    port: 9898
    hostname: backrest.raspi.greedo.net
    env:
      BACKREST_PORT: "0.0.0.0:9898"
      BACKREST_DATA: /data
      BACKREST_CONFIG: /data/config.json
      XDG_CACHE_HOME: /data/cache
      TZ: Africa/Johannesburg
    existingSecret: backrest
    persistence:
      enabled: true
      size: 1Gi
      mountPath: /data
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      readOnlyRootFilesystem: true
      capabilities:
        add: [DAC_READ_SEARCH]
    existingConfigMap: backrest-scripts
    configKeys: [excludes.txt, sync-excludes.py, diff-summary.py, config-template.json, restore-config.py, extract-config.py]
    configMountPath: /scripts
    extraContainers:
      - name: scripts
        image: python:3.14-alpine@sha256:b8b0f41bce4ce74e0e96fc26ae9bfce1f8db8487541eedcfcfc3109f51ee70c7
        command: [sh, -c, "apk add --no-cache restic rclone && sleep infinity"]
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        envFrom:
          - secretRef:
              name: backrest
        volumeMounts:
          - name: data
            mountPath: /data
          - name: config
            mountPath: /scripts
    initContainers:
      - name: fix-data-perms
        image: python:3.14-alpine@sha256:b8b0f41bce4ce74e0e96fc26ae9bfce1f8db8487541eedcfcfc3109f51ee70c7
        command: [chown, -R, "1000:1000", /data]
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
            add: [CHOWN]
        volumeMounts:
          - name: data
            mountPath: /data
      - name: restore-config
        image: python:3.14-alpine@sha256:b8b0f41bce4ce74e0e96fc26ae9bfce1f8db8487541eedcfcfc3109f51ee70c7
        command: [python3, /scripts/restore-config.py]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        envFrom:
          - secretRef:
              name: backrest
        volumeMounts:
          - name: data
            mountPath: /data
          - name: config
            mountPath: /scripts
      - name: sync-excludes
        image: python:3.14-alpine@sha256:b8b0f41bce4ce74e0e96fc26ae9bfce1f8db8487541eedcfcfc3109f51ee70c7
        command: [python3, /scripts/sync-excludes.py]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
          - name: data
            mountPath: /data
          - name: config
            mountPath: /scripts
    hostPaths:
      - name: pvcs
        hostPath: /var/lib/rancher/k3s/storage
        mountPath: /pvcs
        readOnly: true
