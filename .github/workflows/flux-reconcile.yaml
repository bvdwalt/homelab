name: Trigger Flux Reconcile
on:
  push:
    branches:
      - main

jobs:
  reconcile:
    name: Reconcile
    runs-on: ubuntu-latest
    steps:
      - name: Tailscale Connect
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
      - name: Write kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.FLUX_RECONCILE_KUBECONFIG }}" | base64 -d > ~/.kube/config
      - name: Trigger GitRepository reconcile
        run: |
          kubectl -n flux-system annotate gitrepository flux-system \
            reconcile.fluxcd.io/requestedAt="$(date -u +%FT%TZ)" --overwrite
