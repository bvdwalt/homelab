name: Trigger Flux Reconcile
on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: flux-reconcile
  cancel-in-progress: true

jobs:
  reconcile:
    name: Reconcile
    runs-on: ubuntu-latest
    steps:
      - name: Tailscale Connect
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: 10.0.0.167
      - name: Set up kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
      - name: Write kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.FLUX_RECONCILE_KUBECONFIG }}
        run: |
          umask 077
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
      - name: Trigger GitRepository reconcile
        run: |
          kubectl --request-timeout=30s -n flux-system annotate gitrepository flux-system \
            reconcile.fluxcd.io/requestedAt="$(date -u +%FT%TZ)" --overwrite
