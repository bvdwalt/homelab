name: Trivy config scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  misconfig:
    name: Misconfig scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@889be9d6cc8afa8ed639e1e1ba4ab678e3b38d8c # v2.9.4
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Render HelmReleases for scanning
        run: |
          for cluster in altair; do
            uvx --from flux-local flux-local build all "k8s/${cluster}/flux-system" \
              --enable-helm \
              --output-file "/tmp/rendered-${cluster}.yaml"
            python3 ./scripts/split-homelab-app-chart.py \
              "/tmp/rendered-${cluster}.yaml" \
              "k8s/${cluster}/.rendered"
          done
      - name: Trivy misconfig scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: k8s/
          severity: HIGH,CRITICAL
          exit-code: 0
          format: sarif
          output: trivy-results.sarif
          trivyignores: .trivyignore.yaml
          version: v0.74.0
      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always()
        with:
          sarif_file: trivy-results.sarif
