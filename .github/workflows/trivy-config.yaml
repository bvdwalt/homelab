name: Trivy config scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  misconfig:
    name: Misconfig scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@23dcfe98fe672acdf44ecd9c60cbac41b57f5de8 # v2.10.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Render HelmReleases for scanning
        run: |
          for cluster in altair; do
            uvx --from flux-local flux-local build all "k8s/${cluster}/flux-system" \
              --enable-helm \
              --output-file "/tmp/rendered-${cluster}.yaml"
            python3 ./scripts/split-homelab-app-chart.py \
              "/tmp/rendered-${cluster}.yaml" \
              "k8s/${cluster}/.rendered"
          done
      - name: Trivy misconfig scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: k8s/
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: 1
          format: sarif
          output: trivy-results.sarif
          trivyignores: .trivyignore.yaml
          version: v0.76.2
      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        if: always()
        with:
          sarif_file: trivy-results.sarif
