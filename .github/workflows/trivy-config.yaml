name: Trivy config scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  misconfig:
    name: Misconfig scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Render HelmReleases for scanning
        run: |
          for cluster in altair; do
            uvx --from flux-local flux-local build all "k8s/${cluster}/flux-system" \
              --enable-helm \
              --output-file "/tmp/rendered-${cluster}.yaml"
            python3 ./scripts/split-homelab-app-chart.py \
              "/tmp/rendered-${cluster}.yaml" \
              "k8s/${cluster}/.rendered"
          done
      - name: Trivy misconfig scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: k8s/
          severity: HIGH,CRITICAL
          exit-code: 0
          format: sarif
          output: trivy-results.sarif
          trivyignores: .trivyignore.yaml
          version: v0.76.1
      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: trivy-results.sarif
