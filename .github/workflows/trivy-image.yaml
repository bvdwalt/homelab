name: Trivy image scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  image-scan:
    name: Image vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Extract image references
        run: |
          grep -rh 'image:' k8s/ \
            | sed 's/.*image:[[:space:]]*//' \
            | tr -d '"' \
            | grep -E '^[a-z0-9.:/_-]+(:[A-Za-z0-9._-]+)?(@sha256:[a-f0-9]{64})?$' \
            | sort -u \
            | awk -F'@sha256:' '$2=="" || !seen[$2]++' > images.txt
          echo "$(wc -l < images.txt) images to scan"
      - name: Trivy image scan
        run: |
          mkdir -p "$HOME/.trivy-cache" sarif-results
          combined="sarif-results/combined.sarif"
          echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"Trivy","rules":[]}},"results":[]}]}' > "$combined"
          template='{{- range . -}}{{- range .Vulnerabilities -}}{{ .Severity }}|{{ .FixedVersion }}|{{ .VulnerabilityID }}|{{ .PkgName }}{{ "\n" }}{{ end }}{{ end }}'
          errored=0
          failed=0
          while read -r image; do
            echo "::group::$image"
            safe_name=$(echo "$image" | tr -c 'A-Za-z0-9._-' '_')
            if ! rows=$(docker run --rm -v "$HOME/.trivy-cache:/root/.cache" </dev/null \
              aquasec/trivy:0.72.0 image --scanners vuln --quiet \
              --format template --template "$template" "$image" 2>&1); then
              echo "$rows"
              echo "### \`$image\` — SCAN ERROR" >> "$GITHUB_STEP_SUMMARY"
              errored=1
              echo "::endgroup::"
              continue
            fi
            docker run --rm -v "$HOME/.trivy-cache:/root/.cache" -v "$PWD/sarif-results:/out" </dev/null \
              aquasec/trivy:0.72.0 image --scanners vuln --quiet \
              --format sarif --output "/out/${safe_name}.sarif" "$image" || true
            if [ -f "sarif-results/${safe_name}.sarif" ]; then
              jq -s '
                .[0] as $acc | .[1] as $new |
                $acc
                | .runs[0].results += ($new.runs[0].results // [])
                | .runs[0].tool.driver.rules = (($acc.runs[0].tool.driver.rules // []) + ($new.runs[0].tool.driver.rules // []) | unique_by(.id))
              ' "$combined" "sarif-results/${safe_name}.sarif" > "$combined.tmp" \
                && mv "$combined.tmp" "$combined" || true
              rm -f "sarif-results/${safe_name}.sarif"
            fi
            bad_rows=$(echo "$rows" | grep -E '^(HIGH|CRITICAL)\|' || true)
            fixable_critical=$(echo "$rows" | grep -c -E '^CRITICAL\|[^|]+\|' || true)
            echo "$bad_rows"
            echo "fixable CRITICAL: $fixable_critical"
            if [ -n "$bad_rows" ]; then
              {
                echo "### \`$image\`"
                echo '| Severity | Fixed | CVE | Package |'
                echo '|---|---|---|---|'
                echo "$bad_rows" | awk -F'|' '{printf "| %s | %s | %s | %s |\n", $1, ($2==""?"-":$2), $3, $4}'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "$fixable_critical" -gt 0 ]; then
              failed=1
            fi
            echo "::endgroup::"
          done < images.txt
          if [ "$errored" -eq 1 ]; then
            echo "one or more images failed to scan — see step summary" >&2
          fi
          if [ "$failed" -eq 1 ]; then
            echo "fixable CRITICAL vulnerabilities found — see step summary" >&2
          fi
          if [ "$errored" -eq 1 ] || [ "$failed" -eq 1 ]; then
            exit 1
          fi
      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always()
        with:
          sarif_file: sarif-results/combined.sarif
